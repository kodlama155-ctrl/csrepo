name: CloudStream Repo Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "scanner/**"
      - "tests/**"
      - "data/seeds.json"
      - "data/blacklist.json"
      - "requirements.txt"
      - ".github/workflows/daily-scan.yml"

permissions:
  contents: write

concurrency:
  group: cloudstream-repo-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test scanner
        run: python -m unittest discover -s tests -v

      - name: Scan repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Re-ask sites that block this runner (403/451) from a Turkish Globalping probe.
          CSREPO_TR_PROBE: "1"
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        # Keep per-stage records outside the repository so they can be uploaded for analysis.
        run: python scanner/discover.py --state-dir "$RUNNER_TEMP/scan-state"

      # Stage records (inputs, results, durations) for debugging; kept 15 days, never committed.
      - name: Upload stage records
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: scan-stages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-state/
          if-no-files-found: ignore
          retention-days: 15

      - name: Commit scan results
        run: |
          if git diff --quiet -- README.md repo.json plugins.json repo-x92.json plugins-x92.json repos-db.json catalog.md data/catalog.json data/plugin-health.json data/ranking.json data/repos.json data/turkish_all.json data/global.json data/candidates.json data/changes.json data/owner-probes.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "csrepo-bot"
          git config user.email "csrepo-bot@users.noreply.github.com"
          git add README.md repo.json plugins.json repo-x92.json plugins-x92.json repos-db.json catalog.md data/catalog.json data/plugin-health.json data/ranking.json data/repos.json data/turkish_all.json data/global.json data/candidates.json data/changes.json data/owner-probes.json
          git commit -m "chore: update CloudStream repo scan"
          git push
